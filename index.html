<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digivant Microfinance Bank - Seamless financial services for everyone."
    />
    <title>Digivant Microfinance Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Hero Section -->
    <section class="hero" id="hero">
      <!-- Background Decorative Shapes -->
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>

      <div class="hero-container">
        <!-- Left Content -->
        <div class="hero-content">
          <div class="hero-logo">
            <img
              src="public/digitvant.png"
              alt="Digivant Microfinance Bank"
              class="logo-img"
            />
          </div>

          <h1 class="hero-heading">
            Digitvantpay
            <br /><span class="hero-heading-accent">Financial services</span>
          </h1>

          <p class="hero-description">
            Digivant is a licensed Microfinance Bank offering
            <strong>best-in-class financial services in Nigeria</strong>
            and facilitating accessible banking for all.
          </p>

          <div class="hero-badge">
            <span class="hero-badge-text"
              >Licensed and regulated by the Central Bank of Nigeria</span
            >
            <img
              src="public/cbn-logo.png"
              alt="CBN Logo"
              class="cbn-logo w-4 h-4"
              width="25"
              height="25"
            />
          </div>

          <a href="mailto:support@digivant.com" class="hero-cta">
            Contact us
          </a>
        </div>

        <!-- Right Image Stack -->
        <div class="hero-image-wrapper">
          <div class="card-stack">
            <!-- Decorative Back Cards -->
            <div class="card card-3"></div>
            <div class="card card-2"></div>

            <!-- Main Front Card -->
            <div class="card card-1">
              <img
                src="https://images.unsplash.com/photo-1589156280159-27698a70f29e?w=700&h=800&fit=crop&crop=faces"
                alt="Young professional using Digivant banking services"
                class="hero-image"
              />
              <div class="card-overlay">
                <div class="card-badge">Digital First</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
